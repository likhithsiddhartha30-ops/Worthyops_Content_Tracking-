<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content · WorthyOps Content Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="dashboard.html"><span class="logo">W</span><span class="brand-name">WorthyOps<small>Content Tracking</small></span></a>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="content.html" class="active">Content</a>
        <a href="planner.html">Planner</a>
      </nav>
      <div class="user">
        <span id="who"></span>
        <span class="avatar" id="avatar"></span>
        <button class="link-btn" id="logout">Log out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Content</h1>
        <div class="sub">Add posts, plan upcoming content and log performance</div>
      </div>
    </div>

    <section class="card" style="margin-bottom:16px">
      <div class="card-head"><h2 id="form-title">Add content</h2></div>
      <form id="item-form">
        <input type="hidden" id="id">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" required placeholder="e.g. 5 lessons from scaling a creator business">
        </div>
        <div class="form-row">
          <div class="field">
            <label for="platform">Platform</label>
            <select id="platform"></select>
          </div>
          <div class="field">
            <label for="type">Type</label>
            <select id="type"></select>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="planned">Planned</option>
              <option value="scheduled">Scheduled</option>
              <option value="published">Published</option>
            </select>
          </div>
        </div>

        <div id="metrics-wrap">
          <div class="section-label">Performance</div>
          <div id="metrics" class="form-row">
            <div class="field"><label for="reach">Reach / Views</label><input id="reach" type="number" min="0" value="0"></div>
            <div class="field"><label for="likes">Likes</label><input id="likes" type="number" min="0" value="0"></div>
            <div class="field"><label for="comments">Comments</label><input id="comments" type="number" min="0" value="0"></div>
            <div class="field"><label for="shares">Shares / Reposts</label><input id="shares" type="number" min="0" value="0"></div>
            <div class="field"><label for="saves">Saves</label><input id="saves" type="number" min="0" value="0"></div>
          </div>
        </div>

        <div class="section-label">Details</div>
        <div class="form-row">
          <div class="field">
            <label for="link">Post link (optional)</label>
            <input id="link" type="url" placeholder="https://">
          </div>
        </div>
        <div class="field">
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" placeholder="Hook, caption idea, script notes…"></textarea>
        </div>

        <div class="btn-row">
          <button class="btn ghost hidden" type="button" id="cancel">Cancel</button>
          <button class="btn" type="submit" id="save">Save content</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>All content</h2>
        <div class="filters">
          <select id="f-platform" aria-label="Platform"></select>
          <select id="f-status" aria-label="Status">
            <option value="">All statuses</option>
            <option value="planned">Planned</option>
            <option value="scheduled">Scheduled</option>
            <option value="published">Published</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Title</th>
              <th>Platform</th>
              <th>Type</th>
              <th>Status</th>
              <th class="num">Reach</th>
              <th class="num">Eng. rate</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script src="js/content.js"></script>
</body>
</html>
